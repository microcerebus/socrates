<!doctype html>
<!--
  The console after a Run that passed.

  Kept as its own fixture because the shape differs from a failure in a way that
  matters: there is no Expected block at all, so a parser that assumed one would
  either throw or invent it.
-->
<html lang="en"><head><meta charset="utf-8"><title>Two Sum - LeetCode</title></head>
<body>
<div id="__next">
  <div id="qd-content" class="relative flex h-full w-full">
    <div class="flexlayout__tab" data-layout-path="/c1/ts1/t1">
      <div class="space-y-4 px-5 py-4">
        <div class="flex items-center">
          <div class="text-xl font-medium text-green-s" data-e2e-locator="console-result">Accepted</div>
          <div class="ml-4 text-label-3">Runtime: 0 ms</div>
        </div>
        <div class="space-y-4">
          <div>
            <div class="mb-2 text-xs font-medium text-label-3">Input</div>
            <div class="flex flex-col space-y-2">
              <div class="px-3 text-xs">nums =</div>
              <div class="font-menlo text-sm">[2,7,11,15]</div>
              <div class="px-3 text-xs">target =</div>
              <div class="font-menlo text-sm">9</div>
            </div>
          </div>
          <div class="flex h-full w-full flex-col space-y-2">
            <div class="flex text-xs font-medium text-label-3">Output</div>
            <div class="font-menlo text-sm">[0,1]</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
