<!doctype html>
<!--
  A Submit result rather than a Run one.

  The difference the panel cares about is the hook: `submission-result` instead of
  `console-result`, which is how "you failed 35 of 57 hidden cases" is told apart
  from "you failed the two cases in your console". The reading changes with it -
  a submission tally is about coverage, not about the case in front of you.
-->
<html lang="en"><head><meta charset="utf-8"><title>Two Sum - LeetCode</title></head>
<body>
<div id="__next">
  <div id="qd-content" class="relative flex h-full w-full">
    <div class="flexlayout__tab" data-layout-path="/c1/ts1/t1">
      <div class="mx-5 my-4 space-y-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1">
            <span class="mr-2 whitespace-nowrap text-xl font-medium" data-e2e-locator="submission-result">Wrong Answer</span>
            <span>35 / 57 testcases passed</span>
          </div>
        </div>
        <div class="space-y-4">
          <div>
            <div class="mb-2 text-xs font-medium text-label-3">Input</div>
            <div class="flex flex-col space-y-2">
              <div class="px-3 text-xs">nums =</div>
              <div class="font-menlo text-sm">[3,3]</div>
              <div class="px-3 text-xs">target =</div>
              <div class="font-menlo text-sm">6</div>
            </div>
          </div>
          <div class="flex h-full w-full flex-col space-y-2">
            <div class="flex text-xs font-medium text-label-3">Output</div>
            <div class="font-menlo text-sm">[0,0]</div>
          </div>
          <div class="flex h-full w-full flex-col space-y-2">
            <div class="flex text-xs font-medium text-label-3">Expected</div>
            <div class="font-menlo text-sm">[0,1]</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
